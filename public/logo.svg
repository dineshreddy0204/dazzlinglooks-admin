<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 92" fill="none" role="img" aria-label="Dazzlinglooks.in — Beauty Begins Here">
  <defs>
    <linearGradient id="dlGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27" stop-opacity="0.15" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#C59B27" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="dlStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
  </defs>

  <!-- Wordmark: Dazzling (Orange) + looks.in (Deep Purple) -->
  <text x="190" y="38" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" letter-spacing="0.5">
    <tspan fill="#FF6B00">Dazzling</tspan><tspan fill="#3B0764">looks</tspan><tspan fill="#FF6B00" font-size="25" font-weight="600">.in</tspan>
  </text>

  <!-- Gold Decorative Divider & Center Star -->
  <path d="M36 53 H172" stroke="url(#dlGoldGrad)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M208 53 H344" stroke="url(#dlGoldGrad)" stroke-width="1.5" stroke-linecap="round" />
  <!-- Left & Right Diamond Accents -->
  <polygon points="175,53 179,50 183,53 179,56" fill="#D4AF37" />
  <polygon points="197,53 201,50 205,53 201,56" fill="#D4AF37" />
  <!-- Center 8-Point Gold Star -->
  <path d="M190 42 L192.6 49.8 L200.5 52.5 L192.6 55.2 L190 63 L187.4 55.2 L179.5 52.5 L187.4 49.8 Z" fill="url(#dlStarGrad)" />
  <circle cx="190" cy="52.5" r="1.6" fill="#FFFFFF" />

  <!-- Tagline: Beauty Begins Here -->
  <text x="190" y="79" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="4.5" fill="#3B0764">
    BEAUTY BEGINS HERE
  </text>
</svg>
